<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Portfolio Bùi Vân Chi | My Web</title>
    <link rel="shortcut icon" href="/cv/assets/images/maychi-favicon.jpg" type="image/x-icon">
    <link rel="stylesheet" href="/cv/assets/style/glass-button-group-header.css">
    <link rel="stylesheet" href="/custom-scrollbar/style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        .iframe-overlay {
            position: absolute;
            width: 100%;
            height: 29000px;
            top: 0;
            left: 0;
            border: none;
            padding: 0;
            margin: 0;
            /*background-color: red;*/
            z-index: 1;
            visibility: hidden;
            /*display: none;*/
        }
    </style>
</head>

<body>
<!-- Floating Scrollbar for Page -->
<div class="floating-scrollbar" id="pageScrollbar">
    <div class="floating-scrollbar-track">
        <div class="floating-scrollbar-thumb" id="pageScrollbarThumb"></div>
    </div>
</div>

<div id="glass-button-group">
    <a href="/cv/portfolio/" class="active handleOpenCvOrPortfolioPage">Portfolio</a>
    <a href="/cv/" class="handleOpenCvOrPortfolioPage">CV</a>
</div>

<div style="position: relative; width: 100%; height: 0; padding-top: 2283.8214%;
     padding-bottom: 0; box-shadow: 0 2px 8px 0 rgba(63,69,81,0.16); margin-top: 1.6em; margin-bottom: 0.9em; overflow: hidden;
     border-radius: 8px; will-change: transform;">
    <div class="iframe-overlay"></div>
    <iframe loading="lazy"
            style="position: absolute; width: 100%; height: 100%; top: 0; left: 0; border: none; padding: 0;margin: 0;"
            src="https://www.canva.com/design/DAGylALom8g/OwkK6fpq8PEmb1luQM712Q/view?embed"
            allowfullscreen="allowfullscreen" allow="fullscreen">
    </iframe>
</div>

<script src="/cv/assets/script/glass-button-group-header.js"></script>
<script src="/custom-scrollbar/script.js"></script>

<script>
    /**
     * Kiểm tra xem thiết bị hiện tại có hỗ trợ màn hình cảm ứng hay không.
     * @returns {boolean} Trả về `true` nếu là thiết bị cảm ứng, ngược lại trả về `false`.
     */
    function isTouchDevice() {
        return ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    }

    if (isTouchDevice()) {
        // setInterval(() => {
        //     const visibility = document.querySelector('.iframe-overlay').style.visibility;
        //     if (visibility === 'hidden') {
        //         document.querySelector('.iframe-overlay').style.visibility = 'visible'
        //     } else {
        //         document.querySelector('.iframe-overlay').style.visibility = 'hidden'
        //     }
        // }, 1)

        useCustomFloatingScrollbar()
    }

    function useCustomFloatingScrollbar() {
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize floating scrollbar for page
            const floatingScrollbar = new FloatingScrollbar('pageScrollbar', 'pageScrollbarThumb');

            floatingScrollbar.setPersistent(true);
            floatingScrollbar.setPosition('center');
            floatingScrollbar.setSize('compact');
            // floatingScrollbar.setWidth('compact');
            floatingScrollbar.setWidth('custom', 35);
            floatingScrollbar.setOpacity('medium');
            // floatingScrollbar.setOpacity('custom', 10);

            document.documentElement.classList.add('hide-system-scrollbar'); // set on html element to hide system scrollbar
        })
    }
</script>
</body>
</html>
